[project]
name = "vayu"
version = "0.1.0"
description = "VayuDrishti pipeline: ingest -> features -> train -> predict -> publish for urban air-quality intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "geopandas>=1.2.0",
    "shapely>=2.0",
    "pyproj>=3.8.0",
    "pyogrio>=0.9",
    "requests>=2.32",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "tzdata>=2026.5",
    "earthengine-api>=1.7.46",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.3",
    "openai>=2.46.0",
]

[project.scripts]
vayu = "vayu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vayu"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true


[tool.ruff.lint.per-file-ignores]
# Dev-only fixture generator (superseded by real publish) and long literal
# prose strings (citations, honesty notes) where wrapping harms readability.
"scripts/make_fixtures.py" = ["E501", "E702"]
"src/vayu/publish/receipts_build.py" = ["E501"]
"src/vayu/publish/ledger_build.py" = ["E501"]
